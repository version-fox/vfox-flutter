name: License

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  license-eye:
    if: github.repository == 'version-fox/vfox-flutter'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check license headers
        uses: apache/skywalking-eyes@v0.9.0
        with:
          config: .licenserc.yaml
      - name: Check PowerShell license headers
        run: docker run --rm -v "${{ github.workspace }}:/src" ghcr.io/google/addlicense:v1.2.0 -check -f .license.tpl tests/e2e/windows/*.ps1
