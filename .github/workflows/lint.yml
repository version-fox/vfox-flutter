name: Lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    if: github.repository == 'version-fox/vfox-flutter'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.8'
          cache: false
      - name: Check gofmt
        run: test -z "$(gofmt -l .)"
        working-directory: tests/e2e
      - name: Run go vet
        run: go vet ./...
        working-directory: tests/e2e
