name: Lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-go:
    if: github.repository == 'version-fox/vfox-flutter'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.8'
          cache: false
      - name: Check gofmt
        run: test -z "$(gofmt -l .)"
        working-directory: tests/e2e
      - name: Run go vet
        run: go vet ./...
        working-directory: tests/e2e

  lint-lua:
    if: github.repository == 'version-fox/vfox-flutter'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - name: Check Lua formatting
        uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v2.5.2
          args: --check .
      - name: Check Lua
        run: mise x aqua:LuaLS/lua-language-server@3.19.1 -- lua-language-server --check . --checklevel=Warning
