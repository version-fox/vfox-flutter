name: E2E

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-linux:
    if: github.repository == 'version-fox/vfox-flutter'
    name: Linux container (${{ matrix.runs-on }})
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-latest, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - run: docker compose -f tests/e2e/linux/compose.yaml run --rm e2e

  e2e-windows:
    if: github.repository == 'version-fox/vfox-flutter'
    name: Windows container (${{ matrix.runs-on }})
    strategy:
      fail-fast: false
      matrix:
        # TODO See https://github.com/actions/runner-images/issues/13729
        runs-on: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # TODO For compiling moby only. Because https://github.com/actions/runner-images/blob/win11-arm64/20260920.174/images/windows/Windows11-Arm64-Readme.md is still using `Go 1.24.13`.
      - if: matrix.runs-on == 'windows-11-arm'
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.8
          cache: false
      - if: matrix.runs-on == 'windows-11-arm'
        run: pwsh -NoProfile -File tests/e2e/windows/install-docker-arm64.ps1
      - if: matrix.runs-on == 'windows-11-arm'
        name: Install Compose CLI plugin
        run: |
          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\.docker\cli-plugins" | Out-Null
          curl.exe -fsSL "https://github.com/docker/compose/releases/download/v5.5.1/docker-compose-windows-aarch64.exe" -o "$env:USERPROFILE\.docker\cli-plugins\docker-compose.exe"
          docker compose version
      - run: docker compose -f tests/e2e/windows/compose.yaml run --rm --build e2e
        env:
          ARCH: ${{ contains(matrix.runs-on, 'arm') && 'arm64' || 'amd64' }}
