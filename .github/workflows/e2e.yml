name: E2E

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-linux:
    if: github.repository == 'version-fox/vfox-flutter'
    name: Linux container (${{ matrix.runs-on }})
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-latest, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - run: bash tests/e2e/linux/e2e.sh

  e2e-windows:
    if: github.repository == 'version-fox/vfox-flutter'
    name: Windows container (${{ matrix.runs-on }})
    strategy:
      fail-fast: false
      matrix:
        runs-on: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # TODO See https://github.com/actions/runner-images/issues/13729
      - if: matrix.runs-on == 'windows-latest'
        run: |
          for ($i = 1; $i -le 18; $i++) {
              docker info *> $null
              if ($LASTEXITCODE -eq 0) { exit 0 }
              Start-Sleep -Seconds 10
          }
          throw 'FAIL the docker daemon never became ready'
      # TODO For compiling moby only.
      # Because https://github.com/actions/runner-images/blob/win11-arm64/20260920.174/images/windows/Windows11-Arm64-Readme.md is still using `Go 1.24.13`.
      - if: matrix.runs-on == 'windows-11-arm'
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.8
          cache: false
      - if: matrix.runs-on == 'windows-11-arm'
        run: pwsh -NoProfile -File tests/e2e/windows/install-docker-arm64.ps1
      - run: pwsh -NoProfile -File tests/e2e/windows/e2e.ps1
